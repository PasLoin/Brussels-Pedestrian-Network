name: Build & Deploy PMTiles

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "build_site.py"
      - "templates/**"
      - "i18n/**"
      - "robots.txt"
      - "sitemap.xml"
      - "favicon.svg"
      - "app.js"
      - "nav.js"
      - "filters.js"
      - "popups.js"
      - "app.css"
      - "style.json"
  workflow_dispatch:

env:
  HIGHWAY_TYPES_PED: >-
    w/highway=footway
    w/highway=pedestrian
    w/highway=path
    w/highway=living_street
    w/highway=steps
    w/highway=elevator
    w/highway=cycleway
    w/highway=track
    w/highway=platform
    w/railway=platform
    w/public_transport=platform
    n/highway=elevator
    n/highway=crossing
    n/amenity=elevator

  HIGHWAY_TYPES_ROUTING: >-
    w/highway=footway
    w/highway=pedestrian
    w/highway=path
    w/highway=living_street
    w/highway=steps
    w/highway=elevator
    w/highway=cycleway
    w/highway=residential
    w/highway=service
    w/highway=unclassified
    w/highway=tertiary
    w/highway=tertiary_link
    w/highway=secondary
    w/highway=secondary_link
    w/highway=primary
    w/highway=primary_link
    w/highway=track
    w/highway=platform
    w/railway=platform
    w/public_transport=platform
    w/highway=corridor
    w/foot=yes
    w/foot=designated
    n/highway=elevator
    n/highway=crossing
    n/amenity=elevator

  HIGHWAY_TYPES_ROADS: >-
    w/highway=residential
    w/highway=unclassified
    w/highway=tertiary
    w/highway=tertiary_link
    w/highway=secondary
    w/highway=secondary_link
    w/highway=primary
    w/highway=primary_link

  OSM_PBF_URL: https://raw.githubusercontent.com/PasLoin/Osm-python-analyse_Belgium/main/pbf_analyse/history/Brussels-daily.pbf
  OSM_STATE_URL: https://raw.githubusercontent.com/PasLoin/Osm-python-analyse_Belgium/main/pbf_analyse/history/state.txt
  BOUNDARY_POLY_URL: https://raw.githubusercontent.com/PasLoin/Osm-python-analyse_Belgium/main/pbf_analyse/54094.poly

  MIN_ZOOM: 9
  MAX_ZOOM: 19

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool tippecanoe jq

      - name: Install Python dependencies
        run: pip install "shapely>=2" osmnx geopandas igraph numpy pyproj "jinja2>=3.1" --break-system-packages

      - name: Download OSM PBF
        run: |
          wget -O brussels.osm.pbf "$OSM_PBF_URL"
          wget -O state.txt "$OSM_STATE_URL"

      - name: Download analysis boundary
        run: |
          curl -fsSL "$BOUNDARY_POLY_URL" -o analysis_boundary.poly
          head -2 analysis_boundary.poly

      - name: Filter pedestrian features
        run: |
          osmium tags-filter brussels.osm.pbf \
            ${{ env.HIGHWAY_TYPES_PED }} \
            -o highways_ped.osm.pbf --overwrite

      - name: Export pedestrian GeoJSON
        run: |
          osmium export highways_ped.osm.pbf \
            --geometry-types=linestring,point \
            --attributes=type,id \
            -o highways_lines.geojson --overwrite
          osmium export highways_ped.osm.pbf \
            --geometry-types=polygon \
            --attributes=type,id \
            -o highways_areas.geojson --overwrite
          jq '
            def is_platform:
              .highway == "platform"
              or (.highway == null and (.railway == "platform" or .public_transport == "platform"));
            .features |= map(
              select((.properties | is_platform) and .properties.area == "yes")
              | .geometry |= {type: "MultiLineString", coordinates: [.coordinates[][]]}
            )
          ' highways_areas.geojson > platform_outlines.geojson
          jq -s '
            .[0].features += .[1].features
            | .[0]
            | .features |= map(
                if .properties.highway == null
                   and .geometry.type != "Point"
                   and (.properties.railway == "platform" or .properties.public_transport == "platform")
                then .properties.highway = "platform"
                else . end
              )
          ' highways_lines.geojson platform_outlines.geojson > highways.geojson

      - name: Force elevators visible at low zoom
        run: |
          jq '(.features[] | select(
            .properties.highway == "elevator" or
            .properties.amenity == "elevator"
          )) |= . + {"tippecanoe": {"minzoom": 9}}' \
            highways.geojson > highways_fixed.geojson
          mv highways_fixed.geojson highways.geojson

      - name: Slim highways GeoJSON properties
        run: |
          jq '
            .features |= map(
              .properties |= {
                highway:    .highway,
                amenity:    .amenity,
                name:       .name,
                foot:       .foot,
                bicycle:    .bicycle,
                access:     .access,
                segregated: .segregated,
                "crossing:continuous": .["crossing:continuous"],
                tactile_paving: .tactile_paving,
                "@type": .["@type"],
                "@id": .["@id"]
              }
              | with_entries(select(.value != null and .value != ""))
            )
          ' highways.geojson > highways_slim.geojson
          mv highways_slim.geojson highways.geojson

      - name: Filter address features
        run: |
          osmium tags-filter brussels.osm.pbf \
            nw/addr:housenumber \
            -o addresses_raw.osm.pbf --overwrite

      - name: Export addresses GeoJSON
        run: |
          osmium export addresses_raw.osm.pbf \
            --geometry-types=point,polygon \
            -o addresses.geojson --overwrite

      - name: Export road ways for sidewalk analysis
        run: |
          osmium tags-filter brussels.osm.pbf \
            ${{ env.HIGHWAY_TYPES_ROADS }} \
            -o roads_sidewalk.osm.pbf --overwrite
          osmium export roads_sidewalk.osm.pbf \
            --geometry-types=linestring \
            -o sidewalk_roads_raw.geojson --overwrite

      - name: Export footways for sidewalk gap detection
        run: |
          osmium tags-filter brussels.osm.pbf \
            w/highway=footway w/highway=pedestrian \
            -o footways_sidewalk.osm.pbf --overwrite
          osmium export footways_sidewalk.osm.pbf \
            --geometry-types=linestring \
            --attributes=type,id \
            -o sidewalk_footways_raw.geojson --overwrite

      - name: Export kerb nodes for tactile paving QA
        run: |
          osmium tags-filter brussels.osm.pbf n/barrier=kerb n/kerb=no \
            -o kerbs.osm.pbf --overwrite
          osmium export kerbs.osm.pbf \
            --geometry-types=point \
            --attributes=type,id \
            -o kerbs_raw.geojson --overwrite

      - name: Export public transport platforms for island QA
        run: |
          osmium tags-filter brussels.osm.pbf nwr/public_transport=platform \
            -o platforms.osm.pbf --overwrite
          osmium export platforms.osm.pbf \
            --geometry-types=point,linestring,polygon \
            --attributes=type,id \
            -o platforms_raw.geojson --overwrite

      - name: Export excluded ways for crossing exclusion
        run: |
          osmium tags-filter brussels.osm.pbf w/highway=service \
            -o service_roads.osm.pbf --overwrite
          osmium export service_roads.osm.pbf --geometry-types=linestring \
            -o service_roads_raw.geojson --overwrite

          osmium tags-filter brussels.osm.pbf w/highway=cycleway \
            -o cycleways.osm.pbf --overwrite
          osmium export cycleways.osm.pbf --geometry-types=linestring \
            -o cycleways_raw.geojson --overwrite

          osmium tags-filter brussels.osm.pbf w/highway=track \
            -o tracks.osm.pbf --overwrite
          osmium export tracks.osm.pbf --geometry-types=linestring \
            -o tracks_raw.geojson --overwrite

      - name: Filter routing features
        run: |
          osmium tags-filter brussels.osm.pbf \
            ${{ env.HIGHWAY_TYPES_ROUTING }} \
            -o routing_raw.osm.pbf --overwrite

      - name: Convert routing PBF to OSM XML
        run: |
          osmium cat routing_raw.osm.pbf -o routing_raw.osm --overwrite

      - name: Compute pedestrian routing flows
        env:
          PYTHONPATH: scripts
        run: python3 scripts/main.py

      - name: List generated files (debug)
        if: always()
        run: |
          ls -lh *.geojson stats.json graph.json 2>/dev/null || echo "No files found"

      - name: Upload GeoJSON artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: geojson-outputs
          path: |
            flow_edges.geojson
            forced_segments.geojson
            forced_cycleway.geojson
            sidewalk_gaps.geojson
            sidewalk_separate_candidates.geojson
            sidewalk_roads.geojson
            sidewalk_roads_raw.geojson
            sidewalk_footways_raw.geojson
            service_roads_raw.geojson
            cycleways_raw.geojson
            tracks_raw.geojson
            missing_crossings.geojson
            footway_crossing_candidates.geojson
            kerbs_raw.geojson
            tactile_paving_issues.geojson
            kerb_issues.geojson
            highways.geojson
            graph_islands.geojson
            addresses.geojson
            stats.json
            graph.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build main PMTiles (without QA point layers)
        run: |
          tippecanoe \
            -o main.pmtiles \
            --force \
            --name "Brussels Pedestrian Network" \
            --attribution "© OpenStreetMap contributors" \
            -Z${{ env.MIN_ZOOM }} -z${{ env.MAX_ZOOM }} \
            --extend-zooms-if-still-dropping \
            --drop-densest-as-needed \
            --named-layer=highways:highways.geojson \
            --named-layer=sidewalk_gaps:sidewalk_gaps.geojson \
            --named-layer=sidewalk_separate_candidates:sidewalk_separate_candidates.geojson \
            --named-layer=sidewalk_roads:sidewalk_roads.geojson \
            --named-layer=footway_crossing_candidates:footway_crossing_candidates.geojson \
            --named-layer=graph_islands:graph_islands.geojson

      - name: Build flow PMTiles (keep every edge)
        run: |
          tippecanoe \
            -o flow.pmtiles \
            --force \
            -Z${{ env.MIN_ZOOM }} -z${{ env.MAX_ZOOM }} \
            -B${{ env.MIN_ZOOM }} \
            -r1 \
            --no-tile-size-limit \
            --no-feature-limit \
            --named-layer=flow_edges:flow_edges.geojson

      - name: Build QA point layers PMTiles (preserve every point)
        run: |
          tippecanoe \
            -o qa_points.pmtiles \
            --force \
            -Z${{ env.MIN_ZOOM }} -z${{ env.MAX_ZOOM }} \
            -B${{ env.MIN_ZOOM }} \
            -r1 \
            --no-tile-size-limit \
            --no-feature-limit \
            --named-layer=missing_crossings:missing_crossings.geojson \
            --named-layer=tactile_paving_issues:tactile_paving_issues.geojson \
            --named-layer=kerb_issues:kerb_issues.geojson

      - name: Merge into single PMTiles archive
        run: |
          tile-join \
            -o pedestrian.pmtiles \
            --force \
            --no-tile-size-limit \
            --name "Brussels Pedestrian Network" \
            --attribution "© OpenStreetMap contributors" \
            main.pmtiles \
            flow.pmtiles \
            qa_points.pmtiles
          ls -lh main.pmtiles flow.pmtiles qa_points.pmtiles pedestrian.pmtiles

      - name: Add build timestamp to state.txt
        run: echo "build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> state.txt

      - name: Ensure history.json is present
        run: |
          if [[ -f history.json ]] && jq empty history.json 2>/dev/null; then
            echo "Using history.json from current checkout ($(jq 'length' history.json) entries)"
          else
            echo "No valid history.json in this checkout, using an empty list."
            echo '[]' > history.json
          fi

      - name: Prepare site
        run: |
          python3 build_site.py --out _site --lastmod "$(date -u +%Y-%m-%d)"
          cp state.txt stats.json graph.json pedestrian.pmtiles history.json _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: update pedestrian routing flows"
