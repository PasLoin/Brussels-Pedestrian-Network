name: Build & Deploy site pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "build_site.py"
      - "check_i18n.py"
      - "templates/**"
      - "i18n/**"
      - "robots.txt"
      - "favicon.svg"
      - "i18n.js"
      - "lang.js"
      - "html.js"
      - "map/**"
      - "edit/**"
      - "vendor/**"
      - "nav.js"
      - "filters.js"
      - "popups.js"
      - "stats.js"
      - "evolution.js"
      - "app.css"
      - "style.json"
      - "requirements/site.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install site build dependencies
        run: pip install --require-hashes -r requirements/site.txt

      - name: Check translations
        run: python3 check_i18n.py

      - name: Render pages
        run: python3 build_site.py --out _site --lastmod "$(date -u +%Y-%m-%d)"

      - name: Fetch published data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            state.txt
            stats.json
            graph.json
            pedestrian.pmtiles
            communes.geojson
          sparse-checkout-cone-mode: false

      - name: Reuse published data
        run: |
          for f in state.txt stats.json graph.json pedestrian.pmtiles; do
            if [[ ! -s "published/$f" ]]; then
              echo "::error::published/$f is missing: run the Build & Deploy PMTiles workflow first."
              exit 1
            fi
            cp "published/$f" _site/
          done
          if [[ -s published/communes.geojson ]]; then cp published/communes.geojson _site/; fi
          if [[ -f history.json ]] && jq empty history.json 2>/dev/null; then
            cp history.json _site/
          else
            echo '[]' > _site/history.json
          fi
          ls -lh _site

      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: site
          path: _site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Get the built site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: site
          path: _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: update site pages"
