name: Build & Deploy site pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "build_site.py"
      - "check_i18n.py"
      - "templates/**"
      - "i18n/**"
      - "robots.txt"
      - "favicon.svg"
      - "i18n.js"
      - "lang.js"
      - "html.js"
      - "map/**"
      - "edit/**"
      - "package.json"
      - "package-lock.json"
      - "nav.js"
      - "filters.js"
      - "popups.js"
      - "stats.js"
      - "evolution.js"
      - "app.css"
      - "style.json"
      - "requirements/site.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install the site libraries
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install site build dependencies
        run: pip install --require-hashes -r requirements/site.txt

      - name: Check translations
        run: python3 check_i18n.py

      - name: Render pages
        env:
          BPN_EDIT_ALLOWLIST: ${{ vars.BPN_EDIT_ALLOWLIST }}
          BPN_EDIT_ALLOWED_UIDS_DEV: ${{ vars.BPN_EDIT_ALLOWED_UIDS_DEV }}
          BPN_EDIT_ALLOWED_UIDS_PROD: ${{ vars.BPN_EDIT_ALLOWED_UIDS_PROD }}
        run: python3 build_site.py --out _site --lastmod "$(date -u +%Y-%m-%d)"

      - name: Fetch published data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            state.txt
            stats.json
            graph.json
            pedestrian.pmtiles
            communes.geojson
            edit_candidates.json
          sparse-checkout-cone-mode: false

      - name: Reuse published data
        run: |
          for f in state.txt stats.json graph.json pedestrian.pmtiles; do
            if [[ ! -s "published/$f" ]]; then
              echo "::error::published/$f is missing: run the Build & Deploy PMTiles workflow first."
              exit 1
            fi
            cp "published/$f" _site/
          done
          if [[ -s published/communes.geojson ]]; then cp published/communes.geojson _site/; fi
          if [[ -s published/edit_candidates.json ]]; then cp published/edit_candidates.json _site/; else echo "::warning::edit_candidates.json not published yet, Next in the prod editor stays within the loaded tiles."; fi
          if [[ -f history.json ]] && jq empty history.json 2>/dev/null; then
            cp history.json _site/
          else
            echo '[]' > _site/history.json
          fi
          ls -lh _site

      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site
          path: _site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Get the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: site
          path: _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: update site pages"
