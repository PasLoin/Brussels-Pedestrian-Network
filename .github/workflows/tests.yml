name: Tests

on:
  push:
    branches: [main, "fdr-**"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "map/**"
      - "edit/**"
      - "vendor/**"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "build_site.py"
      - "check_i18n.py"
      - "templates/**"
      - "i18n/**"
      - ".github/workflows/**"
      - "requirements/**"
      - ".github/scripts/coverage_summary.py"
      - ".coveragerc"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "map/**"
      - "edit/**"
      - "vendor/**"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "build_site.py"
      - "check_i18n.py"
      - "templates/**"
      - "i18n/**"
      - ".github/workflows/**"
      - "requirements/**"
      - ".github/scripts/coverage_summary.py"
      - ".coveragerc"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/tests.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci --no-audit --no-fund

      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements/tests.txt

      - name: Install browser for layout tests
        run: python -m playwright install --with-deps chromium

      - name: Check translations
        run: python check_i18n.py

      - name: Lint JavaScript
        run: npm run lint

      - name: Run JavaScript tests
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage-js/raw
        run: node --test tests/js/*.test.js

      - name: Run unit tests
        env:
          REQUIRE_BROWSER_TESTS: "1"
          REQUIRE_NODE_TESTS: "1"
          BROWSER_COVERAGE_DIR: ${{ github.workspace }}/coverage-js/raw
        run: python -m pytest tests/ -v --cov --cov-report=term-missing:skip-covered

      - name: JavaScript coverage (unit tests and browser scenarios)
        if: ${{ !cancelled() }}
        run: >
          npx c8 report
          --temp-directory coverage-js/raw
          --reports-dir coverage-js
          --reporter=lcovonly --reporter=text-summary
          --include 'edit/**' --include 'map/**' --include '*.js'
          --exclude 'tests/**' --exclude 'vendor/**' --exclude 'node_modules/**' --exclude 'eslint.config.mjs'
          --all --src .

      - name: Edit code coverage floors
        if: ${{ !cancelled() }}
        run: python .github/scripts/coverage_summary.py --check

      - name: Coverage report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -m coverage json -q
          python -m coverage xml -q
          python -m coverage html -q
          {
            python .github/scripts/coverage_summary.py
            echo "<details><summary>Python, détail par fichier</summary>"
            echo
            python -m coverage report --format=markdown
            echo
            echo "</details>"
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: |
            coverage-summary.md
            coverage.xml
            coverage.json
            coverage-js/lcov.info
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore
