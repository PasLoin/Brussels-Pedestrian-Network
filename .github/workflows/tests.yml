name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install "shapely>=2" osmnx geopandas igraph numpy pyproj pyyaml pytest playwright

      - name: Install browser for layout tests
        run: python -m playwright install --with-deps chromium

      - name: Run JavaScript tests
        run: node --test tests/js/*.test.js

      - name: Run unit tests
        env:
          REQUIRE_BROWSER_TESTS: "1"
          REQUIRE_NODE_TESTS: "1"
        run: python -m pytest tests/ -v
