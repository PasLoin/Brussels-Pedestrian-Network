name: Tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "build_site.py"
      - "check_i18n.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/site.yml"
      - "templates/**"
      - "i18n/**"
      - ".github/workflows/tests.yml"
      - ".github/scripts/coverage_summary.py"
      - ".coveragerc"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pwg/**"
      - "*.js"
      - "*.css"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "build_site.py"
      - "check_i18n.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/site.yml"
      - "templates/**"
      - "i18n/**"
      - ".github/workflows/tests.yml"
      - ".github/scripts/coverage_summary.py"
      - ".coveragerc"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci --no-audit --no-fund

      - name: Install Python dependencies
        run: pip install "shapely>=2" osmnx geopandas igraph numpy pyproj pyyaml "jinja2>=3.1" pytest pytest-cov playwright

      - name: Install browser for layout tests
        run: python -m playwright install --with-deps chromium

      - name: Check translations
        run: python check_i18n.py

      - name: Lint JavaScript
        run: npm run lint

      - name: Run JavaScript tests
        run: node --test tests/js/*.test.js

      - name: JavaScript coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >
          node --test
          --experimental-test-coverage
          --test-coverage-exclude='tests/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          tests/js/*.test.js

      - name: Run unit tests
        env:
          REQUIRE_BROWSER_TESTS: "1"
          REQUIRE_NODE_TESTS: "1"
        run: python -m pytest tests/ -v --cov --cov-report=term-missing:skip-covered

      - name: Coverage report
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -m coverage json -q
          python -m coverage xml -q
          python -m coverage html -q
          {
            python .github/scripts/coverage_summary.py
            echo "<details><summary>Python, détail par fichier</summary>"
            echo
            python -m coverage report --format=markdown
            echo
            echo "</details>"
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            coverage-summary.md
            coverage.xml
            coverage.json
            lcov.info
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore
