name: Refresh PWG schema

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Page wiki à lire (PWG_Schema, PWG_Schema_Draft, …/Schema/1.0.1)"
        required: true
        default: "PWG_Schema"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Fetch and parse PWG schema
        run: python scripts/pwg_schema_fetch.py --page "${{ inputs.page }}"

      - name: Commit pwg/schema.yaml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwg/schema.yaml
          if git diff --cached --quiet; then
            echo "pwg/schema.yaml unchanged, nothing to commit."
          else
            git commit -m "pwg: refresh schema from ${{ inputs.page }}"
            git push
          fi

      - name: Validate overrides against new schema
        run: python scripts/pwg_criteria.py
