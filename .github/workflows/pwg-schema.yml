name: Refresh PWG schema

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Page wiki à lire (PWG_Schema, PWG_Schema_Draft, …/Schema/1.0.1)"
        required: true
        default: "PWG_Schema"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements/pwg.txt

      - name: Fetch and parse PWG schema
        env:
          PAGE: ${{ inputs.page }}
        run: python scripts/pwg_schema_fetch.py --page "$PAGE"

      - name: Keep the new schema for the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pwg-schema
          path: pwg/schema.yaml
          retention-days: 7
          if-no-files-found: error

  commit:
    needs: refresh
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get the new schema
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pwg-schema
          path: pwg

      - name: Commit pwg/schema.yaml
        env:
          PAGE: ${{ inputs.page }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pwg/schema.yaml
          if git diff --cached --quiet; then
            echo "pwg/schema.yaml unchanged, nothing to commit."
          else
            git commit -m "pwg: refresh schema from ${PAGE}"
            git push
          fi

  validate:
    needs: commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the committed schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements/pwg.txt

      - name: Validate overrides against new schema
        run: python scripts/pwg_criteria.py
